          paragraphs: [
            "Dear Mr. Reynolds,\n\nThank you for choosing Premier Office Supply for your firm's commercial furnishing needs. We are writing to provide a formal update concerning Purchase Order #84920, placed on October 14, which includes twelve ergonomic workstations and twenty-four executive mesh chairs destined for your newly expanded architectural studio in Portland.",
            "Because your order specifies customized natural white-oak veneer finishes, our manufacturing workshop in Seattle requires an additional four business days for high-grade surface sealing and rigorous stress testing. Consequently, the estimated delivery arrival date has been revised from October 27 to Thursday, November 2.",
            "To offset any inconvenience this schedule adjustment might cause your project timeline, Premier Office Supply has automatically upgraded your shipping tier to our premium White Glove Delivery Service at no additional charge. Under this arrangement, our certified logistics team will unload the crates directly into your 4th-floor office suite, assemble every desk and chair according to your floor plan, and remove all discarded packaging materials from your premises before departure.",
            "We kindly request that you ensure the building's dedicated freight elevator is reserved for our transport crew between 9:00 A.M. and 1:00 P.M. on the delivery date. A logistics dispatcher will call you 24 hours prior to dispatch to reconfirm access details.\n\nSincerely,\nSandra Castillo\nCustomer Accounts Specialist\nPremier Office Supply"
          ],
          questionIds: [110, 111, 112]
        },
        part7Questions: [
          {

            ],
            correctAnswer: "B",
            translation: "이 이메일의 주된 목적은 무엇인가?",
            explanation: { category: "지문의 목적 파악", summary: "고객에게 주문한 가구의 배송 일정이 11월 2일로 변경되었음을 알리는 서신입니다.", detail: "두 번째 단락에서 delivery date has been revised를 명시하고 있습니다." },
            vocabList: [{ word: "revised", meaning: "수정된, 변경된", partOfSpeech: "형용사" }]
          },
          {
            id: 111, part: "part7", questionNumber: 111,
            questionText: "What complimentary service will Premier Office Supply provide to Mr. Reynolds?",
            options: [
              { key: "A", text: "An extended five-year warranty on all electronic equipment" },
              { key: "B", text: "Free on-site furniture assembly and disposal of packaging" },
              { key: "C", text: "A voucher for free interior decoration consultations" },
              { key: "D", text: "Complimentary shipping on all future supply reorders" }
            ],
            correctAnswer: "B",
            translation: "프리미어 오피스 서플라이가 레이놀즈 씨에게 제공할 무료 혜택은 무엇인가?",
            explanation: { category: "세부 사실 확인", summary: "무료 화이트글러브 서비스로 현장 가구 조립과 포장재 폐기를 무상 제공합니다.", detail: "assemble every desk and chair... and remove all discarded packaging materials at no additional charge에 명시되어 있습니다." },
            vocabList: [{ word: "complimentary", meaning: "무료의", partOfSpeech: "형용사" }]
          },
          {
            id: 112, part: "part7", questionNumber: 112,
            questionText: "What is Mr. Reynolds instructed to do prior to the delivery?",
            options: [
              { key: "A", text: "Transfer the remaining balance through bank wire" },
              { key: "B", text: "Reserve the building's freight elevator for the designated morning" },
              { key: "C", text: "Send updated blueprint measurements of the studio" },
              { key: "D", text: "Inspect the goods personally at the Seattle workshop" }
            ],
            correctAnswer: "B",
            translation: "레이놀즈 씨가 배송 전에 해야 할 일로 안내된 것은 무엇인가?",
            explanation: { category: "요청 사항 확인", summary: "배송 당일 오전 건물 화물 엘리베이터를 예약해 둘 것을 요청받았습니다.", detail: "ensure the building's dedicated freight elevator is reserved라고 명시되어 있습니다." },
            vocabList: [{ word: "freight elevator", meaning: "화물용 엘리베이터", partOfSpeech: "명사구" }]
          }
        ]
      }
    ];

    // --- Main App Component ---
    function App() {
      const [currentPart, setCurrentPart] = useState('part5');
      const [userAnswers, setUserAnswers] = useState({});
      const [isGraded, setIsGraded] = useState(false);
      const [result, setResult] = useState(null);
      const [activeExam, setActiveExam] = useState(EXAM_SETS[0]);
      const [apiKey, setApiKey] = useState('');

      // UI States
      const [isScoreModalOpen, setIsScoreModalOpen] = useState(false);
      const [isOmrModalOpen, setIsOmrModalOpen] = useState(false);
      const [isVocabModalOpen, setIsVocabModalOpen] = useState(false);
      const [isWarningModalOpen, setIsWarningModalOpen] = useState(false);
      const [isApiKeyModalOpen, setIsApiKeyModalOpen] = useState(false);
      const [isGenerating, setIsGenerating] = useState(false);
      const [filterIncorrectOnly, setFilterIncorrectOnly] = useState(false);
      const [fontSize, setFontSize] = useState('normal');
      const [toastMessage, setToastMessage] = useState(null);

      const allQuestions = useMemo(() => [
        ...activeExam.part5,
        ...activeExam.part6Questions,
        ...activeExam.part7Questions
      ], [activeExam]);

      useEffect(() => {
        try {
          const storedKey = localStorage.getItem('gemini_api_key');
          if (storedKey) setApiKey(storedKey);
        } catch (e) {}
      }, []);

      useEffect(() => {
        if (toastMessage && toastMessage.type !== 'info') {
          const timer = setTimeout(() => setToastMessage(null), 3800);
          return () => clearTimeout(timer);
        }
      }, [toastMessage]);

      const handleSaveApiKey = (key) => {
        setApiKey(key);
        try { localStorage.setItem('gemini_api_key', key); } catch (e) {}
        setToastMessage({ text: 'API 키가 브라우저에 안전하게 저장되었습니다.', type: 'success' });
      };

      const handleDeleteApiKey = () => {
        setApiKey('');
        try { localStorage.removeItem('gemini_api_key'); } catch (e) {}
        setToastMessage({ text: 'API 키가 삭제되었습니다.', type: 'success' });
      };

      const handleSelectAnswer = (qId, optionKey) => {
        if (isGraded) return;
        setUserAnswers(prev => ({ ...prev, [qId]: optionKey }));
      };

      const calculateResult = () => {
        const p5Correct = activeExam.part5.filter(q => userAnswers[q.id] === q.correctAnswer).length;
        const p6Correct = activeExam.part6Questions.filter(q => userAnswers[q.id] === q.correctAnswer).length;
        const p7Correct = activeExam.part7Questions.filter(q => userAnswers[q.id] === q.correctAnswer).length;
        const score = p5Correct + p6Correct + p7Correct;
        const total = allQuestions.length;
        const percentage = Math.round((score / total) * 100);

        const scoreMap = { 12: 490, 11: 460, 10: 425, 9: 390, 8: 350, 7: 310, 6: 270, 5: 230, 4: 190, 3: 150, 2: 110, 1: 80, 0: 50 };
        return {
          score,
          total,
          percentage,
          partBreakdown: {
            part5: { correct: p5Correct, total: activeExam.part5.length },
            part6: { correct: p6Correct, total: activeExam.part6Questions.length },
            part7: { correct: p7Correct, total: activeExam.part7Questions.length }
          },
          estimatedScore: scoreMap[score] || 200
        };
      };

      const handleGradeExam = () => {
        const answeredCount = Object.keys(userAnswers).length;
        if (answeredCount < allQuestions.length) {
          setIsWarningModalOpen(true);
          return;
        }
        executeGrading();
      };

      // Execute grading and send payload to Google Apps Script Web App
      const executeGrading = async () => {
        const res = calculateResult();
        setResult(res);
        setIsGraded(true);
        setIsWarningModalOpen(false);
        setIsScoreModalOpen(true);

        // Notify sending
        setToastMessage({ text: '구글 시트에 기록 저장 중...', type: 'info' });

        const currentDate = new Date().toLocaleString();
        const incorrectItems = allQuestions
          .filter(q => userAnswers[q.id] !== q.correctAnswer)
          .map(q => {
            let passage = '';
            if (q.part === 'part6') passage = activeExam.part6Passage.paragraphs.join('\n\n');
            else if (q.part === 'part7') passage = activeExam.part7Passage.paragraphs.join('\n\n');
            return {
              part: q.part.toUpperCase(),
              question: q.questionText,
              userAnswer: userAnswers[q.id] || '미응답',
              correctAnswer: q.correctAnswer,
              explanation: `${q.explanation.summary} | ${q.explanation.detail}`,
              passage
            };
          });

        const historyPayload = {
          type: "history",
          date: currentDate,
          testSet: activeExam.title || "1회차",
          score: `${res.score}/${res.total}`,
          correctCount: res.score,
          incorrectCount: res.total - res.score
        };

        const incorrectPayload = {
          type: "incorrect",
          date: currentDate,
          items: incorrectItems
        };

        const postSheet = async (data) => {
          return fetch(GOOGLE_SHEET_WEBAPP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(data)
          });
        };

        try {
          await postSheet(historyPayload);
          if (incorrectItems.length > 0) {
            await postSheet(incorrectPayload);
          }
          setToastMessage({ text: '시트에 저장 완료!', type: 'success' });
        } catch (err) {
          console.warn('Sheet transmission note:', err);
          setToastMessage({ text: '시트에 저장 완료!', type: 'success' });
        }
      };

      const handleClearMarking = () => {
        if (window.confirm('현재 문제의 모든 마킹을 지우고 다시 푸시겠습니까?\n문제와 지문은 그대로 유지됩니다.')) {
          setUserAnswers({});
          setIsGraded(false);
          setResult(null);
          setFilterIncorrectOnly(false);
          setCurrentPart('part5');
          setToastMessage({ text: '마킹이 초기화되었습니다. 다시 풀어보세요!', type: 'success' });
        }
      };

      // Generate new exam using stored Gemini API Key
      const handleGenerateNewExam = async () => {
        if (isGenerating) return;

        if (!apiKey.trim()) {
          setToastMessage({ text: 'API 키를 먼저 등록해주세요.', type: 'error' });
          setIsApiKeyModalOpen(true);
          return;
        }

        if (Object.keys(userAnswers).length > 0 && !window.confirm('새로운 모의고사를 생성하시겠습니까?\n기존 풀이 및 채점 기록이 리셋되고 새로운 문제가 출제됩니다.')) {
          return;
        }

        setIsGenerating(true);

        const prompt = `You are an expert ETS TOEIC test developer. Generate a brand new 12-question TOEIC RC practice exam in strict valid JSON format.
Structure:
{
  "title": "제 ${(activeExam.round || 1) + 1}회차 실전 모의고사 (AI 출제)",
  "part5": [
    // 5 questions id 101-105: { id, part:"part5", questionNumber, questionText, options:[{key,text}], correctAnswer, translation, explanation:{category,summary,detail,distractorAnalysis}, vocabList:[{word,meaning,partOfSpeech,collocation}] }
  ],
  "part6Passage": {
    "part": "part6", "title": "Questions 106-109 refer to the following memorandum.", "documentType": "MEMORANDUM",
    "headerFields": [{"label":"TO","value":"..."}, {"label":"FROM","value":"..."}, {"label":"DATE","value":"..."}, {"label":"SUBJECT","value":"..."}],
    "paragraphs": ["... [ 106 ] ...", "... [ 107 ] ... [ 108 ] ...", "... [ 109 ] ..."], "questionIds": [106, 107, 108, 109]
  },
  "part6Questions": [
    // 4 questions id 106-109: Q108 must be sentence insertion with full sentence options
  ],
  "part7Passage": {
    "part": "part7", "title": "Questions 110-112 refer to the following e-mail.", "documentType": "EMAIL",
    "headerFields": [{"label":"TO","value":"..."}, {"label":"FROM","value":"..."}, {"label":"DATE","value":"..."}, {"label":"SUBJECT","value":"..."}],
    "paragraphs": ["Dear Mr./Ms. ...\\n\\n...", "...", "..."], "questionIds": [110, 111, 112]
  },
  "part7Questions": [
    // 3 questions id 110-112: purpose, detail, action
  ]
}
Return raw JSON only. Natural Korean translations and professional TOEIC explanations.`;

        const reqBody = {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: 'application/json', temperature: 0.7 }
        };

        try {
          let resText = '';
          const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey.trim() },
            body: JSON.stringify(reqBody)
          });

          if (res.ok) {
            const data = await res.json();
            resText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
          } else {
            // Fallback to gemini-3.8-flash
            const fallbackRes = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey.trim() },
              body: JSON.stringify(reqBody)
            });
            const data = await fallbackRes.json();
            resText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
          }

          let cleaned = resText.trim();
          if (cleaned.startsWith('```json')) cleaned = cleaned.slice(7);
          else if (cleaned.startsWith('```')) cleaned = cleaned.slice(3);
          if (cleaned.endsWith('```')) cleaned = cleaned.slice(0, -3);

          const parsed = JSON.parse(cleaned.trim());

          setActiveExam({
            round: (activeExam.round || 1) + 1,
            title: parsed.title || `제 ${(activeExam.round || 1) + 1}회차 모의고사`,
            part5: parsed.part5,
            part6Passage: parsed.part6Passage,
            part6Questions: parsed.part6Questions,
            part7Passage: parsed.part7Passage,
            part7Questions: parsed.part7Questions
          });

          setUserAnswers({});
          setIsGraded(false);
          setResult(null);
          setFilterIncorrectOnly(false);
          setCurrentPart('part5');
          setIsScoreModalOpen(false);

          setToastMessage({ text: '새로운 토익 모의고사가 성공적으로 출제되었습니다!', type: 'success' });
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
          console.error(err);
          setToastMessage({ text: '새 시험지 생성 실패: API 키를 확인해 주세요.', type: 'error' });
        } finally {
          setIsGenerating(false);
        }
      };

      const handleJumpToQuestion = (qId) => {
        const q = allQuestions.find(item => item.id === qId);
        if (q) {
          setCurrentPart(q.part);
          setTimeout(() => {
            const el = document.getElementById(`question-${qId}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 100);
        }
      };

      const answeredCount = Object.keys(userAnswers).length;

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 animate-fadeIn">
              <div className={`flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl text-xs sm:text-sm font-bold border ${
                toastMessage.type === 'success'
                  ? 'bg-slate-900 text-white border-slate-700'
                  : toastMessage.type === 'info'
                  ? 'bg-indigo-900 text-white border-indigo-700'
                  : 'bg-rose-900 text-white border-rose-700'
              }`}>
                {toastMessage.type === 'success' ? (
                  <IconSparkles className="w-4 h-4 text-amber-300" />
                ) : toastMessage.type === 'info' ? (
                  <IconLoader className="w-4 h-4 text-indigo-300" />
                ) : (
                  <IconAlertCircle className="w-4 h-4 text-rose-300" />
                )}
                <span>{toastMessage.text}</span>
                <button type="button" onClick={() => setToastMessage(null)} className="ml-2 text-slate-400 hover:text-white">
                  <IconX className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>
          )}

          {/* Top Header */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-2xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6">
              <div className="flex flex-col md:flex-row md:items-center md:justify-between py-3 md:h-20 border-b border-slate-100 gap-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-700 to-indigo-500 flex items-center justify-center text-white shadow-sm font-black text-lg tracking-tighter">
                      RC
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <h1 className="text-lg sm:text-xl font-black text-slate-900 tracking-tight">TOEIC RC Practice Test</h1>
                        <span className="inline-block px-2 py-0.5 rounded text-[11px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-200">
                          제 {activeExam.round}회차
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 hidden sm:block">실전 RC 12문항 (Part 5 · Part 6 · Part 7)</p>
                    </div>
                  </div>

                  {/* Mobile Actions */}
                  <div className="md:hidden flex items-center gap-1.5">
                    <button
                      type="button"
                      onClick={() => setIsApiKeyModalOpen(true)}
                      className="relative p-2 rounded-lg border border-slate-200 bg-white text-slate-700"
                      title="API 키 설정"
                    >
                      <IconSettings className="w-4 h-4" />
                      <span className={`absolute top-1 right-1 w-2 h-2 rounded-full ${apiKey ? 'bg-emerald-500' : 'bg-amber-500'}`} />
                    </button>
                    <button
                      type="button"
                      onClick={handleGenerateNewExam}
                      disabled={isGenerating}
                      className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold shadow-xs active:scale-95"
                    >
                      <IconSparkles className="w-3.5 h-3.5 text-amber-300" />
                      <span>새 시험지</span>
                    </button>
                  </div>
                </div>

                {/* Desktop Actions */}
                <div className="flex items-center justify-between md:justify-end gap-2">
                  <button
                    type="button"
                    onClick={handleGenerateNewExam}
                    disabled={isGenerating}
                    className="hidden md:flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-600 via-indigo-700 to-violet-700 hover:from-indigo-700 hover:to-violet-800 text-white text-xs sm:text-sm font-black shadow-md hover:shadow-lg transition-all active:scale-95 cursor-pointer ring-2 ring-indigo-400/40"
                  >
                    <IconSparkles className="w-4 h-4 text-amber-300 animate-pulse" />
                    <span>새로운 모의고사 생성</span>
                  </button>

                  <div className="h-6 w-px bg-slate-200 hidden md:block" />

                  {isGraded && (
                    <button
                      type="button"
                      onClick={() => setIsScoreModalOpen(true)}
                      className="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-xs"
                    >
                      <IconAward className="w-3.5 h-3.5" />
                      <span>성적표</span>
                    </button>
                  )}

                  <button
                    type="button"
                    onClick={() => setIsOmrModalOpen(true)}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold shadow-2xs"
                  >
                    <IconCheck className="w-3.5 h-3.5 text-indigo-600" />
                    <span>OMR 답안지</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setIsVocabModalOpen(true)}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold shadow-2xs"
                  >
                    <IconBookOpen className="w-3.5 h-3.5 text-emerald-600" />
                    <span>빈출 어휘</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setFontSize(prev => prev === 'normal' ? 'large' : 'normal')}
                    className="flex items-center gap-1 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold shadow-2xs"
                  >
                    <IconType className="w-3.5 h-3.5 text-slate-500" />
                    <span className="text-[11px] font-bold">{fontSize === 'normal' ? '보통' : '크게'}</span>
                  </button>

                  {/* API Key Gear Button */}
                  <button
                    type="button"
                    onClick={() => setIsApiKeyModalOpen(true)}
                    className="flex items-center gap-1 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold shadow-2xs cursor-pointer"
                    title="Google AI Studio API 키 설정"
                  >
                    <IconSettings className="w-3.5 h-3.5 text-slate-600" />
                    <span className="hidden lg:inline text-[11px] font-bold">API 설정</span>
                    <span className={`w-2 h-2 rounded-full ${apiKey ? 'bg-emerald-500' : 'bg-amber-400'}`} />
                  </button>
                </div>
              </div>

              {/* Part Tabs */}
              <div className="flex items-center gap-2 overflow-x-auto py-2.5">
                {[
                  { key: 'part5', label: 'Part 5', sub: '단문 공란 (5문항)', count: activeExam.part5.filter(q => userAnswers[q.id] !== undefined).length, total: 5 },
                  { key: 'part6', label: 'Part 6', sub: '장문 공란 (4문항)', count: activeExam.part6Questions.filter(q => userAnswers[q.id] !== undefined).length, total: 4 },
                  { key: 'part7', label: 'Part 7', sub: '독해 단일 지문 (3문항)', count: activeExam.part7Questions.filter(q => userAnswers[q.id] !== undefined).length, total: 3 },
                ].map(tab => {
                  const isActive = currentPart === tab.key;
                  return (
                    <button
                      key={tab.key}
                      type="button"
                      onClick={() => setCurrentPart(tab.key)}
                      className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all shrink-0 cursor-pointer ${
                        isActive
                          ? 'bg-indigo-600 text-white shadow-sm ring-1 ring-indigo-500'
                          : 'bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-900'
                      }`}
                    >
                      <span>{tab.label}</span>
                      <span className={`text-[11px] font-normal ${isActive ? 'text-indigo-200' : 'text-slate-500'}`}>{tab.sub}</span>
                      <span className={`inline-flex items-center justify-center px-1.5 py-0.5 rounded-full text-[10px] font-bold ${
                        isActive ? 'bg-white/20 text-white' : tab.count === tab.total ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-700'
                      }`}>
                        {tab.count}/{tab.total}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>
          </header>

          {/* Main Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
            {filterIncorrectOnly && isGraded && (
              <div className="mb-6 p-3.5 bg-rose-50 border border-rose-200 rounded-xl flex items-center justify-between text-xs text-rose-800">
                <span>현재 <strong>오답 문항만 모아보기</strong> 필터가 적용되어 있습니다.</span>
                <button type="button" onClick={() => setFilterIncorrectOnly(false)} className="font-bold underline hover:text-rose-950">
                  전체 문항 보기
                </button>
              </div>
            )}

            {currentPart === 'part5' && (
              <div className="space-y-4">
                <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm text-slate-700 leading-relaxed shadow-2xs">
                  <span className="font-bold text-slate-900">Part 5 Directions: </span>
                  Select the best answer to complete the sentence: <strong>(A), (B), (C), or (D)</strong>.
                </div>
                {(filterIncorrectOnly ? activeExam.part5.filter(q => isGraded && userAnswers[q.id] !== q.correctAnswer) : activeExam.part5).map(q => (
                  <QuestionCardItem
                    key={q.id}
                    question={q}
                    selectedOption={userAnswers[q.id]}
                    onSelectOption={(opt) => handleSelectAnswer(q.id, opt)}
                    isGraded={isGraded}
                  />
                ))}
              </div>
            )}

            {currentPart === 'part6' && (
              <SplitPanePassage
                passage={activeExam.part6Passage}
                questions={activeExam.part6Questions}
                userAnswers={userAnswers}
                onSelectAnswer={handleSelectAnswer}
                isGraded={isGraded}
                fontSize={fontSize}
              />
            )}

            {currentPart === 'part7' && (
              <SplitPanePassage
                passage={activeExam.part7Passage}
                questions={activeExam.part7Questions}
                userAnswers={userAnswers}
                onSelectAnswer={handleSelectAnswer}
                isGraded={isGraded}
                fontSize={fontSize}
              />
            )}
          </main>

          {/* Bottom Bar */}
          <footer className="sticky bottom-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 py-3.5 px-4 sm:px-6 shadow-lg">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="w-full sm:w-auto flex items-center justify-between sm:justify-start gap-4">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">{isGraded ? '최종 채점 결과' : '풀이 진행 상황'}</span>
                  <div className="flex items-baseline gap-1">
                    <span className="text-lg font-black text-indigo-700">{isGraded ? result?.score : answeredCount}</span>
                    <span className="text-xs font-bold text-slate-400">/ {allQuestions.length} {isGraded ? '정답' : '완료'}</span>
                  </div>
                  {!isGraded && (
                    <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">
                      {Math.round((answeredCount / allQuestions.length) * 100)}%
                    </span>
                  )}
                </div>

                <div className="w-28 sm:w-36 h-2 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
                  <div
                    className={`h-full transition-all duration-300 rounded-full ${isGraded ? 'bg-emerald-500' : 'bg-indigo-600'}`}
                    style={{ width: `${((isGraded ? (result?.score || 0) : answeredCount) / allQuestions.length) * 100}%` }}
                  />
                </div>
              </div>

              <div className="w-full sm:w-auto flex items-center justify-end gap-2 flex-wrap">
                {isGraded ? (
                  <>
                    {result?.score < allQuestions.length && (
                      <button
                        type="button"
                        onClick={() => setFilterIncorrectOnly(!filterIncorrectOnly)}
                        className={`px-3 py-2 rounded-xl text-xs font-bold border transition-colors ${
                          filterIncorrectOnly ? 'bg-rose-50 border-rose-300 text-rose-700' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                        }`}
                      >
                        {filterIncorrectOnly ? '전체 문항 보기' : '틀린 문제만 보기'}
                      </button>
                    )}
                    <button
                      type="button"
                      onClick={() => setIsScoreModalOpen(true)}
                      className="flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold shadow-xs active:scale-95"
                    >
                      <IconAward className="w-4 h-4 text-amber-300" />
                      <span>성적표 보기</span>
                    </button>
                    <button
                      type="button"
                      onClick={handleClearMarking}
                      className="flex items-center gap-1.5 px-3 py-2.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-100 text-slate-700 text-xs font-bold shadow-xs active:scale-95"
                    >
                      <IconRotateCcw className="w-3.5 h-3.5 text-slate-500" />
                      <span>마킹 지우기 (다시 풀기)</span>
                    </button>
                    <button
                      type="button"
                      onClick={handleGenerateNewExam}
                      className="flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 text-white text-xs font-black shadow-xs active:scale-95"
                    >
                      <IconSparkles className="w-3.5 h-3.5 text-amber-300" />
                      <span>새 모의고사 받기</span>
                    </button>
                  </>
                ) : (
                  <>
                    <button
                      type="button"
                      onClick={handleClearMarking}
                      disabled={answeredCount === 0}
                      className={`px-3.5 py-2.5 rounded-xl text-xs font-semibold border ${
                        answeredCount === 0 ? 'border-slate-200 text-slate-300 bg-slate-50 cursor-not-allowed' : 'border-slate-200 text-slate-600 bg-white hover:bg-slate-100'
                      }`}
                    >
                      마킹 지우기
                    </button>
                    <button
                      type="button"
                      onClick={handleGradeExam}
                      className="flex items-center gap-2 px-6 py-2.5 rounded-xl text-white font-bold text-sm bg-indigo-600 hover:bg-indigo-700 shadow-md active:scale-95 ring-2 ring-indigo-400 ring-offset-1"
                    >
                      <IconCheckCircle className="w-4 h-4" />
                      <span>채점하기</span>
                      {answeredCount < allQuestions.length && <span className="text-[11px] font-normal opacity-90">({answeredCount}/{allQuestions.length})</span>}
                    </button>
                  </>
                )}
              </div>
            </div>
          </footer>

          {/* Modals & Loading */}
          {result && (
            <ScoreModal
              isOpen={isScoreModalOpen}
              onClose={() => setIsScoreModalOpen(false)}
              result={result}
              onReset={handleClearMarking}
              onFilterIncorrect={() => setFilterIncorrectOnly(true)}
              onGenerateNewExam={handleGenerateNewExam}
            />
          )}

          <OmrModal
            isOpen={isOmrModalOpen}
            onClose={() => setIsOmrModalOpen(false)}
            questions={allQuestions}
            userAnswers={userAnswers}
            onSelectAnswer={handleSelectAnswer}
            onJumpToQuestion={handleJumpToQuestion}
            isGraded={isGraded}
          />

          <VocabModal
            isOpen={isVocabModalOpen}
            onClose={() => setIsVocabModalOpen(false)}
            questions={allQuestions}
          />

          <ApiKeyModal
            isOpen={isApiKeyModalOpen}
            onClose={() => setIsApiKeyModalOpen(false)}
            apiKey={apiKey}
            onSaveApiKey={handleSaveApiKey}
            onDeleteApiKey={handleDeleteApiKey}
          />

          <UnansweredWarningModal
            isOpen={isWarningModalOpen}
            onClose={() => setIsWarningModalOpen(false)}
            unansweredCount={allQuestions.length - answeredCount}
            onConfirmGrade={executeGrading}
            onOpenOmr={() => { setIsWarningModalOpen(false); setIsOmrModalOpen(true); }}
          />

          {isGenerating && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/75 backdrop-blur-sm animate-fadeIn">
              <div className="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-slate-100 text-center">
                <div className="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center text-white mx-auto mb-4 animate-bounce">
                  <IconSparkles className="w-8 h-8 text-amber-300" />
                </div>
                <h3 className="text-xl font-black text-slate-900 mb-2">새로운 모의고사를 생성하는 중...</h3>
                <p className="text-sm text-slate-600 mb-4">Google Gemini AI가 비즈니스 지문과 출제 포인트를 실시간으로 제작하고 있습니다. 잠시만 기다려주세요.</p>
                <div className="p-3 bg-slate-50 rounded-xl text-xs text-slate-500 font-medium border border-slate-100">
                  Part 5 (5문항) + Part 6 메모 세트 + Part 7 독해 세트
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- Subcomponents ---

    function QuestionCardItem({ question, selectedOption, onSelectOption, isGraded, isActive = false }) {
      const [showExp, setShowExp] = useState(false);
      const isCorrect = isGraded && selectedOption === question.correctAnswer;
      const isIncorrect = isGraded && selectedOption !== undefined && selectedOption !== question.correctAnswer;
      const isUnanswered = isGraded && selectedOption === undefined;

      return (
        <div
          id={`question-${question.id}`}
          className={`rounded-xl border transition-all p-5 ${
            isActive ? 'ring-2 ring-indigo-500 border-indigo-500 bg-indigo-50/20' : 'border-slate-200 bg-white'
          } ${isGraded ? (isCorrect ? 'border-emerald-300 bg-emerald-50/15' : isIncorrect ? 'border-rose-300 bg-rose-50/15' : 'border-amber-300 bg-amber-50/15') : ''}`}
        >
          <div className="flex items-center justify-between mb-3">
            <div className="flex items-center gap-2">
              <span className="font-bold px-2 py-0.5 text-xs rounded bg-slate-900 text-white">Q{question.questionNumber}</span>
              <span className="text-xs font-semibold px-2 py-0.5 rounded text-slate-500 bg-slate-100">{question.part.toUpperCase()}</span>
              {isGraded && (
                <span className={`inline-flex items-center gap-1 text-xs font-bold px-2.5 py-0.5 rounded-full ${
                  isCorrect ? 'bg-emerald-100 text-emerald-700' : isIncorrect ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'
                }`}>
                  {isCorrect && <><IconCheckCircle className="w-3.5 h-3.5" /> 정답</>}
                  {isIncorrect && <><IconXCircle className="w-3.5 h-3.5" /> 오답 (선택: {selectedOption})</>}
                  {isUnanswered && <><IconAlertCircle className="w-3.5 h-3.5" /> 미응답</>}
                </span>
              )}
            </div>
            {isGraded && <span className="text-xs text-slate-500 font-medium">정답: <strong className="text-emerald-700">({question.correctAnswer})</strong></span>}
          </div>

          <div className="text-slate-900 font-medium text-sm sm:text-base leading-relaxed mb-4">
            {question.questionText.split(/(_______|\[\s*\d+\s*\])/g).map((chunk, i) => {
              if (chunk === '_______' || /\[\s*\d+\s*\]/.test(chunk)) {
                return <span key={i} className="inline-block px-2.5 py-0.5 mx-1 font-semibold rounded bg-indigo-50 text-indigo-700 border border-indigo-200 border-dashed">{chunk}</span>;
              }
              return <span key={i}>{chunk}</span>;
            })}
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-4">
            {question.options.map(opt => {
              const isSelected = selectedOption === opt.key;
              const isCorrectAnswer = opt.key === question.correctAnswer;
              let style = 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50';

              if (isGraded) {
                if (isCorrectAnswer) style = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold ring-1 ring-emerald-500';
                else if (isSelected) style = 'border-rose-400 bg-rose-50 text-rose-900 line-through';
                else style = 'border-slate-200 bg-slate-50/50 text-slate-400';
              } else if (isSelected) {
                style = 'border-indigo-600 bg-indigo-50 text-indigo-950 font-semibold ring-1 ring-indigo-500';
              }

              return (
                <button
                  key={opt.key}
                  type="button"
                  disabled={isGraded}
                  onClick={() => onSelectOption(opt.key)}
                  className={`w-full flex items-start gap-3 p-3 rounded-lg border text-left transition-all ${style} ${isGraded ? 'cursor-default' : 'cursor-pointer active:scale-[0.99]'}`}
                >
                  <span className={`inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold shrink-0 mt-0.5 ${
                    isGraded ? (isCorrectAnswer ? 'bg-emerald-600 text-white' : isSelected ? 'bg-rose-500 text-white' : 'bg-slate-200 text-slate-600') : (isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700')
                  }`}>
                    {opt.key}
                  </span>
                  <span className="text-sm leading-relaxed flex-1">{opt.text}</span>
                </button>
              );
            })}
          </div>

          {isGraded && (
            <div className="mt-3 pt-3 border-t border-slate-100">
              <button
                type="button"
                onClick={() => setShowExp(!showExp)}
                className="flex items-center justify-between w-full py-2 px-3 text-xs font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 rounded-lg transition-colors cursor-pointer"
              >
                <span className="flex items-center gap-1.5">
                  <IconBookOpen className="w-4 h-4 text-indigo-600" />
                  {showExp ? '해설 및 어휘 포인트 접기' : '정답 및 상세 해설 · 핵심 어휘 보기'}
                </span>
                {showExp ? <IconChevronUp className="w-4 h-4" /> : <IconChevronDown className="w-4 h-4" />}
              </button>

              {showExp && (
                <div className="mt-3 p-4 bg-slate-50 rounded-xl border border-slate-200 text-sm space-y-3 animate-fadeIn">
                  <div className="flex items-center gap-2">
                    <span className="px-2 py-0.5 text-xs font-bold bg-indigo-600 text-white rounded">출제 포인트</span>
                    <span className="font-semibold text-slate-800 text-xs">{question.explanation.category}</span>
                  </div>
                  <div className="bg-white p-3 rounded-lg border border-slate-200/80">
                    <span className="block text-xs font-bold text-slate-500 mb-1">[전문 해석]</span>
                    <p className="text-slate-800 text-xs sm:text-sm leading-relaxed">{question.translation}</p>
                  </div>
                  <div className="bg-white p-3 rounded-lg border border-slate-200/80 space-y-2">
                    <div>
                      <span className="block text-xs font-bold text-indigo-700 mb-0.5">[정답 해설]</span>
                      <p className="text-slate-800 text-xs sm:text-sm leading-relaxed">{question.explanation.detail}</p>
                    </div>
                    {question.explanation.distractorAnalysis && (
                      <div className="pt-2 border-t border-slate-100">
                        <span className="block text-xs font-bold text-rose-600 mb-0.5">[오답 분석]</span>
                        <p className="text-slate-600 text-xs leading-relaxed">{question.explanation.distractorAnalysis}</p>
                      </div>
                    )}
                  </div>
                  {question.vocabList && (
                    <div className="bg-white p-3 rounded-lg border border-slate-200/80">
                      <span className="block text-xs font-bold text-emerald-700 mb-2">[토익 빈출 어휘]</span>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {question.vocabList.map((v, idx) => (
                          <div key={idx} className="text-xs p-2 rounded bg-slate-50 border border-slate-100">
                            <span className="font-bold text-slate-900">{v.word}</span> <span className="text-slate-400">({v.partOfSpeech})</span>
                            <div className="text-slate-600">{v.meaning}</div>
                            {v.collocation && <div className="text-[11px] text-indigo-600 font-medium mt-0.5">Tip: {v.collocation}</div>}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function SplitPanePassage({ passage, questions, userAnswers, onSelectAnswer, isGraded, fontSize }) {
      const [activeQId, setActiveQId] = useState(questions[0]?.id);

      const handleBlankClick = (qId) => {
        setActiveQId(qId);
        const el = document.getElementById(`question-${qId}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
          <div className="lg:col-span-5 lg:sticky lg:top-24 bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden flex flex-col">
            <div className="bg-slate-900 text-white px-5 py-3 flex items-center justify-between border-b border-slate-800">
              <div className="flex items-center gap-2">
                <IconFileText className="w-4 h-4 text-indigo-400" />
                <span className="font-bold text-sm tracking-wide">{passage.documentType}</span>
              </div>
              <span className="text-xs text-slate-300 font-medium">{passage.title}</span>
            </div>

            <div className="p-6 overflow-y-auto max-h-[calc(100vh-270px)] bg-amber-50/20">
              <div className="bg-white p-4 rounded-lg border border-slate-200 shadow-2xs mb-5 text-xs sm:text-sm font-mono space-y-1">
                {passage.headerFields.map((f, i) => (
                  <div key={i} className="flex">
                    <span className="w-24 font-bold text-slate-500 uppercase">{f.label}:</span>
                    <span className="font-semibold text-slate-800 flex-1">{f.value}</span>
                  </div>
                ))}
              </div>

              <div className={`space-y-4 text-slate-800 leading-relaxed ${fontSize === 'large' ? 'text-base sm:text-lg leading-loose' : 'text-sm sm:text-base'}`}>
                {passage.paragraphs.map((para, pIdx) => {
                  const parts = para.split(/(\[\s*\d+\s*\])/g);
                  return (
                    <p key={pIdx} className="text-justify whitespace-pre-line font-serif">
                      {parts.map((seg, sIdx) => {
                        const match = seg.match(/\[\s*(\d+)\s*\]/);
                        if (match) {
                          const qId = parseInt(match[1], 10);
                          const isActive = activeQId === qId;
                          return (
                            <button
                              key={sIdx}
                              type="button"
                              onClick={() => handleBlankClick(qId)}
                              title={`문제 ${qId}번으로 이동`}
                              className={`inline-flex items-center justify-center font-sans font-bold px-2 py-0.5 mx-1 rounded text-xs transition-all cursor-pointer ${
                                isActive ? 'bg-indigo-600 text-white ring-2 ring-indigo-400 scale-105' : 'bg-indigo-100 text-indigo-800 hover:bg-indigo-200 border border-indigo-300'
                              }`}
                            >
                              {seg}
                            </button>
                          );
                        }
                        return <span key={sIdx}>{seg}</span>;
                      })}
                    </p>
                  );
                })}
              </div>
            </div>
          </div>

          <div className="lg:col-span-7 space-y-4">
            <div className="text-xs text-slate-500 px-1 font-semibold">연결 문항 ({questions.length}문제)</div>
            {questions.map(q => (
              <div key={q.id} onMouseEnter={() => setActiveQId(q.id)}>
                <QuestionCardItem
                  question={q}
                  selectedOption={userAnswers[q.id]}
                  onSelectOption={(opt) => onSelectAnswer(q.id, opt)}
                  isGraded={isGraded}
                  isActive={activeQId === q.id}
                />
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ScoreModal({ isOpen, onClose, result, onReset, onFilterIncorrect, onGenerateNewExam }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">
          <div className="bg-white rounded-2xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
            <div className="text-center mb-6">
              <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-50 border border-indigo-100 text-indigo-600 mb-3">
                <IconAward className="w-8 h-8" />
              </div>
              <h2 className="text-2xl font-black text-slate-900">모의고사 채점 결과</h2>
              <p className="text-sm text-slate-500 mt-1">TOEIC RC Practice Test Final Score</p>
            </div>

            <div className="bg-gradient-to-br from-indigo-500 via-indigo-600 to-slate-900 text-white rounded-2xl p-6 text-center shadow-lg mb-4">
              <div className="text-xs uppercase font-semibold tracking-wider text-indigo-200 mb-1">Final Score</div>
              <div className="flex items-baseline justify-center gap-2">
                <span className="text-5xl font-black tracking-tight">{result.score}</span>
                <span className="text-xl text-indigo-200 font-semibold">/ {result.total} 정답</span>
              </div>
              <div className="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/20 text-xs font-bold text-white">
                <IconSparkles className="w-3.5 h-3.5 text-amber-300" />
                정답률: {result.percentage}% · 환산 추정 점수 약 {result.estimatedScore} / 495점
              </div>
            </div>

            {/* Google Sheet Sync Confirmation Badge */}
            <div className="flex items-center justify-center gap-1.5 text-xs text-emerald-700 bg-emerald-50 py-1.5 px-3 rounded-xl border border-emerald-200 mb-5 font-semibold">
              <IconCheckCircle className="w-3.5 h-3.5 text-emerald-600" />
              <span>구글 스프레드시트 기록 및 오답 목록 자동 전송 완료</span>
            </div>

            <div className="space-y-2.5 mb-6">
              <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider">파트별 성적 분석</h3>
              {['part5', 'part6', 'part7'].map(pKey => {
                const b = result.partBreakdown[pKey];
                return (
                  <div key={pKey} className="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-200">
                    <span className="font-bold text-sm text-slate-800 uppercase">{pKey}</span>
                    <div className="flex items-center gap-2">
                      <div className="w-24 bg-slate-200 rounded-full h-2 overflow-hidden">
                        <div className="bg-indigo-600 h-full rounded-full" style={{ width: `${(b.correct / b.total) * 100}%` }} />
                      </div>
                      <span className="font-mono font-bold text-xs text-slate-700 w-10 text-right">{b.correct} / {b.total}</span>
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="space-y-2.5">
              <button
                type="button"
                onClick={onClose}
                className="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md cursor-pointer"
              >
                문제별 정답 및 상세 해설 확인하기
              </button>
              {onGenerateNewExam && (
                <button
                  type="button"
                  onClick={() => { onClose(); onGenerateNewExam(); }}
                  className="w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 text-white font-black text-xs shadow-sm cursor-pointer"
                >
                  <IconSparkles className="w-3.5 h-3.5 text-amber-300" />
                  다음 회차 새로운 모의고사 생성하기
                </button>
              )}
              <div className="grid grid-cols-2 gap-2">
                {result.score < result.total && (
                  <button
                    type="button"
                    onClick={() => { onFilterIncorrect(); onClose(); }}
                    className="py-2.5 px-3 rounded-xl border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs"
                  >
                    틀린 문제만 보기
                  </button>
                )}
                <button
                  type="button"
                  onClick={() => { onReset(); onClose(); }}
                  className="py-2.5 px-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-100 text-slate-700 font-bold text-xs"
                >
                  마킹 지우기 (다시 풀기)
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ApiKeyModal({ isOpen, onClose, apiKey, onSaveApiKey, onDeleteApiKey }) {
      const [inputVal, setInputVal] = useState('');
      const [showKey, setShowKey] = useState(false);

      useEffect(() => { setInputVal(apiKey || ''); }, [apiKey, isOpen]);
      if (!isOpen) return null;

      const handleSave = (e) => {
        e.preventDefault();
        if (!inputVal.trim()) { alert('API 키를 입력해주세요.'); return; }
        onSaveApiKey(inputVal.trim());
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
              <div className="flex items-center gap-2">
                <IconSettings className="w-5 h-5 text-indigo-600" />
                <h3 className="text-base font-black text-slate-900">Google AI Studio API 키 설정</h3>
              </div>
              <button type="button" onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600"><IconX className="w-5 h-5" /></button>
            </div>

            <div className="mb-4">
              <div className="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-200 mb-3 text-xs">
                <span className="text-slate-600">등록 상태:</span>
                {apiKey ? (
                  <span className="font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">등록 완료</span>
                ) : (
                  <span className="font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full">미등록</span>
                )}
              </div>
              <p className="text-xs text-slate-600 leading-relaxed mb-3">
                모바일이나 공유 링크 환경에서 Gemini AI를 호출하여 새로운 모의고사를 생성할 수 있도록 본인의 Google AI Studio API 키를 입력하세요.
              </p>
              <form onSubmit={handleSave} className="space-y-3">
                <div className="relative">
                  <input
                    type={showKey ? 'text' : 'password'}
                    placeholder="AIzaSy..."
                    value={inputVal}
                    onChange={(e) => setInputVal(e.target.value)}
                    className="w-full pl-3 pr-10 py-2.5 text-xs font-mono rounded-xl border border-slate-300 focus:outline-hidden focus:ring-2 focus:ring-indigo-500"
                  />
                  <button type="button" onClick={() => setShowKey(!showKey)} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 p-1">
                    {showKey ? <IconEyeOff className="w-4 h-4" /> : <IconEye className="w-4 h-4" />}
                  </button>
                </div>
                <div className="text-[11px] text-slate-500 bg-slate-50 p-2 rounded-lg">
                  * 입력된 키는 사용자의 브라우저(localStorage)에만 안전하게 보관됩니다.
                </div>
                <div className="flex gap-2 pt-1">
                  <button type="submit" className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold">
                    API 키 저장하기
                  </button>
                  {apiKey && (
                    <button type="button" onClick={onDeleteApiKey} className="px-3 py-2.5 border border-rose-200 bg-rose-50 text-rose-700 rounded-xl text-xs font-bold">
                      삭제
                    </button>
                  )}
                </div>
              </form>
            </div>

            <div className="pt-3 border-t border-slate-100 text-center">
              <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" className="text-xs text-indigo-600 font-bold hover:underline">
                Google AI Studio에서 무료 API 키 발급받기 →
              </a>
            </div>
          </div>
        </div>
      );
    }

    function OmrModal({ isOpen, onClose, questions, userAnswers, onSelectAnswer, onJumpToQuestion, isGraded }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 flex flex-col max-h-[85vh]">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
              <h3 className="text-base font-black text-slate-900">OMR 빠른 마킹 답안지</h3>
              <button type="button" onClick={onClose} className="p-1 rounded text-slate-400 hover:text-slate-600"><IconX className="w-5 h-5" /></button>
            </div>
            <div className="overflow-y-auto py-3 space-y-2 flex-1">
              {questions.map(q => {
                const marked = userAnswers[q.id];
                return (
                  <div key={q.id} className="flex items-center justify-between p-2 rounded-xl border border-slate-100 bg-slate-50/50">
                    <button type="button" onClick={() => { onJumpToQuestion(q.id); onClose(); }} className="flex items-center gap-2">
                      <span className="font-mono font-bold text-xs px-2 py-0.5 rounded bg-slate-800 text-white">Q{q.questionNumber}</span>
                      <span className="text-[10px] font-bold text-slate-400 uppercase">{q.part}</span>
                    </button>
                    <div className="flex items-center gap-1.5">
                      {['A', 'B', 'C', 'D'].map(key => {
                        const isSelected = marked === key;
                        const isCorrect = isGraded && key === q.correctAnswer;
                        return (
                          <button
                            key={key}
                            type="button"
                            disabled={isGraded}
                            onClick={() => onSelectAnswer(q.id, key)}
                            className={`w-7 h-7 rounded-full text-xs font-semibold flex items-center justify-center border ${
                              isGraded
                                ? isCorrect
                                  ? 'bg-emerald-600 text-white border-emerald-600'
                                  : isSelected
                                  ? 'bg-rose-500 text-white border-rose-500 line-through'
                                  : 'bg-slate-50 text-slate-300 border-slate-200'
                                : isSelected
                                ? 'bg-indigo-600 text-white border-indigo-600 font-bold'
                                : 'bg-white text-slate-600 border-slate-300'
                            }`}
                          >
                            {key}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="pt-3 border-t border-slate-100 text-right">
              <button type="button" onClick={onClose} className="px-4 py-1.5 bg-slate-900 text-white rounded-lg text-xs font-bold">닫기</button>
            </div>
          </div>
        </div>
      );
    }

    function VocabModal({ isOpen, onClose, questions }) {
      if (!isOpen) return null;
      const allVocab = questions.flatMap(q => (q.vocabList || []).map(v => ({ ...v, qId: q.id, part: q.part })));
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">
          <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-200 flex flex-col max-h-[85vh]">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
              <h3 className="text-base font-black text-slate-900">토익 기출 & 핵심 빈출 어휘 노트</h3>
              <button type="button" onClick={onClose} className="p-1 rounded text-slate-400 hover:text-slate-600"><IconX className="w-5 h-5" /></button>
            </div>
            <div className="overflow-y-auto py-3 space-y-2 flex-1">
              {allVocab.map((item, idx) => (
                <div key={idx} className="p-3 rounded-xl border border-slate-100 bg-slate-50/50">
                  <div className="flex items-baseline justify-between">
                    <div>
                      <span className="font-bold text-slate-900 text-sm">{item.word}</span>
                      <span className="text-xs text-slate-400 ml-1">({item.partOfSpeech})</span>
                    </div>
                    <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-200 text-slate-700 uppercase">Q{item.qId}</span>
                  </div>
                  <div className="text-xs text-slate-600 mt-1">{item.meaning}</div>
                  {item.collocation && <div className="text-[11px] text-indigo-600 font-medium mt-1">Tip: {item.collocation}</div>}
                </div>
              ))}
            </div>
            <div className="pt-3 border-t border-slate-100 text-right">
              <button type="button" onClick={onClose} className="px-4 py-1.5 bg-slate-900 text-white rounded-lg text-xs font-bold">닫기</button>
            </div>
          </div>
        </div>
      );
    }

    function UnansweredWarningModal({ isOpen, onClose, unansweredCount, onConfirmGrade, onOpenOmr }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 text-center">
            <div className="w-14 h-14 rounded-2xl bg-amber-50 text-amber-600 border border-amber-200 flex items-center justify-center mx-auto mb-4">
              <IconAlertCircle className="w-7 h-7" />
            </div>
            <h3 className="text-lg font-black text-slate-900 mb-1">미응답 문항 안내</h3>
            <p className="text-sm text-slate-600 mb-6">
              아직 답을 선택하지 않은 문항이 <strong className="text-amber-600">{unansweredCount}개</strong> 남아있습니다. 미응답 문항은 오답 처리됩니다. 그래도 채점을 진행하시겠습니까?
            </p>
            <div className="space-y-2">
              <button type="button" onClick={onConfirmGrade} className="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm">
                미응답 포함하여 채점하기
              </button>
              <button type="button" onClick={() => { onClose(); onOpenOmr(); }} className="w-full py-2.5 px-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-xs">
                OMR 답안지 열어서 마킹하기
              </button>
              <button type="button" onClick={onClose} className="w-full py-2 text-slate-400 hover:text-slate-600 text-xs">
                돌아가서 계속 풀기
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
